name: K8s Manifest Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            elk-stack/*.yaml \
            prometheus/*.yaml \
            nexus/*.yaml \
            nginx/*.yaml \
            vllm/base/*.yaml \
            vllm/components/amd/*.yaml \
            vllm/components/finetune/*.yaml \
            vllm/benchmark/*.yaml \
            vllm/overlays/kubeadm/*.yaml \
            vllm/overlays/kubeadm/amd/*.yaml \
            vllm/overlays/kubeadm/finetune/*.yaml \
            vllm/overlays/kind/*.yaml \
            vllm/overlays/kind/amd/*.yaml \
            vllm/overlays/kind/finetune/*.yaml \
            .github/workflows/*.yaml \
            kind/*.yaml \
            kind/addons/*.yaml \
            argocd/apps/*.yaml

  validate:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1

      - name: Install kubeconform
        run: |
          set -euo pipefail
          wget -q "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Set up helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # kustomize ビルド結果と単体マニフェスト（パッチ除く）を kubeconform で検証する。
      # 旧 kustomize ジョブ（ビルドのみ）はこのジョブに統合した。
      - name: Validate K8s manifests (kustomize build + kubeconform)
        run: bash scripts/kubeconform-validate.sh

  model-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate vLLM model profiles JSON
        run: python3 vllm/benchmark/scripts/validate_model_profiles.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

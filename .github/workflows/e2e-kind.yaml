name: E2E on kind

# kind 上の e2e スイート（scripts/e2e/run.sh）。
# 設計: docs/design/k8s-native-backlog-redesign.md 1.4 節
# スイートの一覧は scripts/e2e/suites/*.sh から自動で作る（スイート追加時にこのファイルを触らない）
on:
  pull_request:
    branches: [master]
    paths:
      - "elk-stack/**"
      - "scripts/e2e/**"
      - "kind/test-cluster*.yaml"
      - "kubeadm/addons/network-policies/**"
      - "kubeadm/addons/metallb/**"
      - "kubeadm/scripts/00-configure-lb.sh"
      - "vllm/components/serena-export/**"
      - "vllm/overlays/kind/serena-export/**"
      - "vllm/components/teacher-stub/**"
      - "vllm/benchmark/**"
      - "ollama/k8s/**"
      - "scripts/serena-rag-query.py"
      - ".github/workflows/e2e-kind.yaml"
  workflow_dispatch:
    inputs:
      suite:
        description: "suite name (scripts/e2e/run.sh --list)"
        required: true
        default: elk-serena-ingest

# PR runs of the same branch supersede each other (#85). Push/dispatch runs get a
# unique group (run_id), so a master run is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # p95 6s; floor 5 (#85)
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      - id: suites
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            suites="$(jq -cn --arg s "${INPUT_SUITE}" '[$s]')"
          else
            suites="$(find scripts/e2e/suites -name '*.sh' -printf '%f\n' | sed 's/\.sh$//' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          echo "suites=${suites}"
          echo "suites=${suites}" >> "${GITHUB_OUTPUT}"

  e2e:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 25  # p95 423s / max 449s over 106 runs, ~3x p95 (#85)
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.list.outputs.suites) }}
    env:
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@v4

      - name: Runner resources
        run: |
          nproc
          free -g
          df -h /

      - name: Install kind
        run: |
          set -euo pipefail
          # リポジトリに kind/ ディレクトリがあるため、カレントではなく RUNNER_TEMP に落とす
          curl -fsSLo "${RUNNER_TEMP}/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          kind version
          kubectl version --client
          jq --version

      - name: Run suite ${{ matrix.suite }}
        run: bash scripts/e2e/run.sh "${{ matrix.suite }}" --target kind

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.suite }}
          path: e2e-results/
          if-no-files-found: ignore

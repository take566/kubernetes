# deploy-note 用 overlay (#73)
# deploy-note には IngressClass / Ingress コントローラが無い。base の Ingress
# (ingressClassName: nginx) は ADDRESS が付かず、Argo CD の prometheus Application が
# Progressing のまま終わらない。ここでは Ingress だけを消す。Prometheus には
# kubectl -n monitoring port-forward svc/prometheus 9090:9090 でアクセスする。
# base (prometheus/) は変えないので、Ingress コントローラのあるクラスタはそのまま使える。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: prometheus
        namespace: monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: agents
  labels:
    app: hermes
    app.kubernetes.io/name: hermes
    app.kubernetes.io/part-of: agents
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        app.kubernetes.io/name: hermes
        app.kubernetes.io/part-of: agents
        app.kubernetes.io/managed-by: kustomize
    spec:
      terminationGracePeriodSeconds: 60
      # Starts as root on purpose (#31). The image is s6-overlay based: its
      # bootstrap remaps the hermes user to HERMES_UID/HERMES_GID, chowns the
      # data volume and then runs Hermes as that user. With runAsUser: 1000 it
      # stopped with "container started with --user 1000 ... not supported
      # under the s6-overlay image". Hermes itself still runs as uid 1000.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          args: ["gateway", "run"]
          ports:
            - name: gateway
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          env:
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: GATEWAY_HEALTH_URL
              value: "http://127.0.0.1:8642/healthz"
            # The user the image's bootstrap drops to (see securityContext).
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secret
                  key: API_SERVER_KEY
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            # Only what the bootstrap needs to remap the user, chown the data
            # volume and drop to it; all within the baseline profile.
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data

# 平日 09:00 JST: collect → check-bounces → enrich → ... → sync (送信なし)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dm-system-pipeline
  namespace: dm-system
spec:
  schedule: "0 9 * * 1-5"
  timeZone: Asia/Tokyo
  # 前の実行が残っていたら重ねない / クラスタ停止中に逃した回は 3600 秒以内なら実行する
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 自動リトライしない (送信の二重実行を避ける)。失敗は Discord に通知される
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dm-system
            app.kubernetes.io/component: pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: pipeline
              image: dm-system:local
              imagePullPolicy: IfNotPresent
              command: ["/app/.venv/bin/python", "/app/scripts/hermes/dm-system-pipeline.py"]
              envFrom:
                - secretRef:
                    name: dm-system-env
              env:
                # シートに書いてよい実行環境の印 (Deploy-inc/dm-system#175)。dm-system は
                # SHEETS_WRITER の無い環境ではシートに書かない (古い・別マシンのコピー対策)
                - name: SHEETS_WRITER
                  value: k8s
                # 全体の時間予算 (Deploy-inc/dm-system#177)。activeDeadlineSeconds (10800) で
                # Pod ごと殺されるとログも Discord 通知も残らないので、その 600 秒手前で
                # パイプライン自身に打ち切らせて失敗を通知させる。上の deadline を変えたら合わせる
                - name: DM_PIPELINE_BUDGET_SEC
                  value: "10200"
                # .env.tpl のローカル (Windows) パスを上書きする
                - name: GMAIL_OAUTH2_TOKEN_PATH
                  value: /app/secrets/gmail_token.json
                - name: GMAIL_OAUTH2_CREDENTIALS_PATH
                  value: /app/secrets/gmail_credentials.json
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /app/secrets/google_adc_credentials.json
                - name: GOOGLE_CREDENTIALS_PATH
                  value: /app/secrets/credentials.json
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: state
                  mountPath: /app/data
                  subPath: data
                - name: state
                  mountPath: /app/secrets
                  subPath: secrets
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: dm-system-state
            # Playwright (chromium) 用
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi

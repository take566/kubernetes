# 例示のみ (kustomization には含めない)。値はリポジトリに置かない。
# 実際の Secret は dm-system リポジトリの scripts/k8s/apply-secrets.sh が
# 1Password (.env.tpl の op:// 参照) から生成して投入する。
apiVersion: v1
kind: Secret
metadata:
  name: dm-system-env
  namespace: dm-system
type: Opaque
stringData:
  MY_NAME: "..."
  MY_EMAIL: "..."
  GMAIL_AUTH_METHOD: "oauth2"
  GOOGLE_SPREADSHEET_ID: "..."
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/..."

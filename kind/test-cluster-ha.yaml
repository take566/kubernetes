# e2e 用 HA kind クラスタ（stacked etcd の control-plane 3 台 + worker 1 台）。
# kind は control-plane の前段に haproxy の LB コンテナ（<cluster>-external-load-balancer）を自動で置く。
# scripts/e2e/suites/ha-control-plane.sh が使う（#20）。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker

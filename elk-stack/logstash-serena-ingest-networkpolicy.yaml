# Allow Serena collectors (pods labeled app=serena-collector, any namespace) to reach
# Logstash TCP ingest on port 5000. Windows host collectors come in via kubectl port-forward.
# Without this, logstash-allow-distill-ingest makes Logstash ingress default-deny. (#14)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logstash-allow-serena-ingest
  namespace: elk-stack
  labels:
    app: logstash
    app.kubernetes.io/part-of: elk-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app: logstash
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: serena-collector
      ports:
        - protocol: TCP
          port: 5000

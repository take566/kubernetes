apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
labels:
  - pairs:
      app.kubernetes.io/part-of: vllm
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/cluster: kubeadm
    includeSelectors: false
    includeTemplates: false
resources:
  - ../../base
  - vllm-pvc.yaml
patches:
  - path: model-patch.yaml
# Longhorn を使う場合は vllm/overlays/kubeadm/longhorn/ を apply する（apply-addons.sh --with-longhorn 後、worker 3 台以上推奨）

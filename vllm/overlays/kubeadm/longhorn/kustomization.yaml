# vLLM kubeadm overlay の Longhorn 版（vllm-model-cache を storageClassName: longhorn にする）。
# 前提: kubeadm/addons/apply-addons.sh --with-longhorn（worker 3 台以上を推奨）
# Apply: kubectl apply -k vllm/overlays/kubeadm/longhorn/
# kubeadm overlay との差は StorageClass だけにする（scripts/e2e/suites/storage-pvc-contract.sh が diff で確かめる。#23）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
labels:
  - pairs:
      app.kubernetes.io/part-of: vllm
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/cluster: kubeadm
    includeSelectors: false
    includeTemplates: false
resources:
  - ../../../base
  - vllm-pvc.yaml
patches:
  - path: model-patch.yaml

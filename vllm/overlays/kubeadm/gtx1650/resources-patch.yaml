apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          resources:
            # Measured on deploy-note 2026-10-04: ~15m CPU at steady state (the
            # model runs on the GPU). A 1-core request reserved 20% of the
            # 5-CPU node for nothing; the 2-core limit still covers startup.
            requests:
              cpu: 250m
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"

# kube-prometheus-stack Helm values
# Replaces hand-written prometheus manifests with integrated monitoring stack
# Includes: Prometheus, Grafana, Alertmanager, Node Exporter, kube-state-metrics

prometheus:
  prometheusSpec:
    # Central metrics store (take566/ansible#991, #1015): tmf-m3 (mac-k3s) and
    # deploy-note remote_write their OpenClaw Prometheus here through
    # http://100.84.245.6:19090/api/v1/write (WSL socat + Windows portproxy,
    # take566/ansible inventory host_vars ubuntu / tmf-desktop). The receiver
    # has no auth, so it is exposed on the tailnet only, never the LAN.
    enableRemoteWriteReceiver: true
    # Every series scraped here gets cluster="tmf-desktop", the label the edges
    # set through external_labels, so count by (cluster) (up) sees all three.
    scrapeClasses:
      - name: cluster
        default: true
        relabelings:
          # action is spelled out: the CRD defaults it, and Argo then shows
          # the Prometheus as OutOfSync forever.
          - action: replace
            targetLabel: cluster
            replacement: tmf-desktop
    # 30 days like the OpenClaw Prometheus it replaces; the size cap keeps the
    # TSDB inside the 8Gi PVC with three clusters writing.
    retention: 30d
    retentionSize: 6GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          # No storageClassName: the cluster default (local-path on the
          # kubeadm nodes). "standard" exists only on kind (#95).
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

grafana:
  enabled: true
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "Asia/Tokyo"

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

nodeExporter:
  enabled: true

# The node-exporter subchart. hostNetwork, so its port is a node port: the
# `prometheus` app's own node-exporter already holds 9100 in this namespace,
# so this one moves to 9101 and both stacks can run (#95).
prometheus-node-exporter:
  # WSL kubeadm: "/" is not a shared/slave mount, so the chart's hostRootFs
  # mount with mountPropagation HostToContainer fails with
  # CreateContainerError (measured on tmf-desktop, #95).
  hostRootFsMount:
    enabled: false
  service:
    port: 9101
    targetPort: 9101
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 100Mi

kubeStateMetrics:
  enabled: true

# Default alerting rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryWorkingSetBytes: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    node: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 200
        runAsGroup: 200
        fsGroup: 200
        seccompProfile:
          type: RuntimeDefault
      # nexus-pv is a hostPath volume (/data/nexus). kubelet creates that
      # directory owned by root, and fsGroup does not apply to hostPath, so
      # nexus (uid 200) could not create /nexus-data/log and crashed with
      # "openFile(.../nexus3/log/nexus.log) ... FileNotFoundException" (#31).
      # Hand the volume root to uid 200 before nexus starts; everything below
      # it is then created by nexus itself.
      initContainers:
      - name: volume-owner
        image: busybox:1.36
        command: ["sh", "-c", "chown 200:200 /nexus-data && chmod 0750 /nexus-data"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
            cpu: "100m"
        volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
      containers:
      - name: nexus
        image: sonatype/nexus3:3.85.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: nexus-web
          containerPort: 8081
          protocol: TCP
        - name: docker-registry
          containerPort: 8082
          protocol: TCP
        - name: npm-registry
          containerPort: 8083
          protocol: TCP
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
        livenessProbe:
          httpGet:
            path: /service/metrics/healthcheck
            port: nexus-web
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /service/metrics/healthcheck
            port: nexus-web
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: nexus-data
        persistentVolumeClaim:
          claimName: nexus-pvc

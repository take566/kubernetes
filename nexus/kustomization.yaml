# path: nexus を使う既存の利用者（Ingress コントローラのあるクラスタ、kubectl apply -k nexus/）
# 向けの入口。中身は base/ と同一（#70 で base/ に移動）。
# kustomize は overlay の祖先ディレクトリを base にできない（cycle detected）ため、
# マニフェスト本体は nexus/base/ に置き、overlays/<cluster>/ から ../../base を参照する。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base

# deploy-note 用 overlay (#70)
# deploy-note には IngressClass / Ingress コントローラが無い。base の Ingress
# (ingressClassName: nginx) は ADDRESS が付かず、Argo CD の nexus Application が
# Progressing のまま終わらない。ここでは Ingress だけを消し、NodePort
# (service/nexus-nodeport: 30081-30083) で公開する。
# base (nexus/) は変えないので、Ingress コントローラのあるクラスタはそのまま使える。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# deploy-note は WSL VM 16GB の単一ノードで、常駐の nexus (約 2.4GiB) が READY 0/1 のまま
# 追い出しと再作成を繰り返し、ARC の CI runner (k8s-x64) が Insufficient memory で Pending になる
# (Deploy-inc/OpenClaw#2938)。使う時に replicas を 1 に戻す (または base を直接使う overlay を足す)。
replicas:
  - name: nexus
    count: 0
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: nexus
        namespace: nexus

# 例のみ。実値はコミットしない。クラスタ上で直接作成するのを推奨:
#   kubectl -n gitlab create secret generic gitlab-initial-root-password \
#     --from-literal=password="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-initial-root-password
  namespace: gitlab
type: Opaque
stringData:
  password: CHANGE_ME

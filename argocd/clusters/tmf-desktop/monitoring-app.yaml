# Manual sync — shares namespace `monitoring` with `prometheus`. The stack's
# node-exporter listens on 9101 (values.yaml) so both can run side by side.
# ServerSideApply: the monitoring.coreos.com CRDs exceed the 256 KiB
# last-applied annotation client-side apply writes (#95).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true

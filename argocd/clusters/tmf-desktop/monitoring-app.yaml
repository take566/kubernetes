# Manual sync. The legacy `prometheus` Application that shared this namespace
# was removed (#98): it owned Namespace/monitoring, so its finalizer was
# dropped first and its objects deleted by hand. node-exporter stays on 9101
# (values.yaml); 9100 was the legacy DaemonSet's.
# ServerSideApply: the monitoring.coreos.com CRDs exceed the 256 KiB
# last-applied annotation client-side apply writes (#95).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true

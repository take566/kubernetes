# Manual sync — requires github-runners-secret before sync (see github-runners/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-runners
  namespace: argocd
  # No resources-finalizer (take566/ansible#1002): never deployed (Missing).
  # Without it, removing this file prunes only the Application. Step 1 of 2.
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    path: github-runners
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: github-runners
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

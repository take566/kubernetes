# Manual sync — ARC controller installs CRDs; sync before github-runners.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runner-controller
  namespace: argocd
  # No resources-finalizer (take566/ansible#1002): this app owns the live actions.github.com
  # CRDs, which take566/ansible terraform/k8s arc.tf's ARC (k8s-x64-tmf) uses.
  # Without it, removing this file prunes only the Application. Step 1 of 2.
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    path: actions-runner-controller
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  # No resources-finalizer (#98): this app owns Namespace/monitoring, which
  # kube-prometheus-stack also lives in. Without the finalizer, removing this
  # file prunes only the Application, never the namespace. Step 1 of 2.
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    # deploy-note に Ingress コントローラが無いので Ingress を消す overlay (#73)
    path: prometheus/overlays/tmf-desktop
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

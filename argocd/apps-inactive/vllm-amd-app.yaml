# Manual sync — mutually exclusive with vllm-kubeadm / vllm-kind auto-sync in namespace vllm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-amd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: vllm
    app.kubernetes.io/cluster: kubeadm
spec:
  project: default
  source:
    repoURL: https://github.com/take566/kubernetes.git
    targetRevision: master
    path: vllm/overlays/kubeadm/amd
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
